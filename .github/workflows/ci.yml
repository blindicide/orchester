name: Build and safety checks
on:
  push:
  pull_request:
concurrency:
  group: orchester-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cancel-obsolete:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', branch: context.ref.replace('refs/heads/', ''), per_page: 30
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id !== context.runId && run.head_sha !== context.sha && run.status !== 'completed') {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
                core.info(`Cancelled superseded run ${run.id}`);
              }
            }
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Unit/Orchester.Tests.csproj -c Release
      - run: python3 tests/check_resources.py
  windows:
    timeout-minutes: 12
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Orchester.slnx -c Release
      - run: dotnet run --project tests/Unit/Orchester.Tests.csproj -c Release --no-build
      - run: ./tests/Windows/Run-Checks.ps1
        timeout-minutes: 3
      - run: dotnet publish src/Orchester.App/Orchester.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/Orchester
      - run: dotnet publish src/Orchester.Helper/Orchester.Helper.csproj -c Release -r win-x64 --self-contained true -o artifacts/Orchester
      - uses: actions/upload-artifact@v4
        with:
          name: Orchester-win-x64-preview
          path: artifacts/Orchester/
